<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Menú</title>
<meta name="description" content="Menú semanal y compra de Rocío">
<meta name="theme-color" content="#eee6da">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Menú">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{--ink:#151311;--muted:#5f574e;--paper:#eee6da;--white:#fffdf9;--line:#d3c8b8;--red:#e5192d;--cream:#fbf1c4;--ok:#00b65b;--font:"Quicksand","Nunito","Trebuchet MS",system-ui,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font:500 16px/1.45 var(--font)}
  body{min-height:100dvh;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px)}
  main{max-width:520px;margin:0 auto}
  .head{display:flex;align-items:center;gap:14px}
  .head img{width:60px;height:60px;border-radius:50%}
  .brand{display:inline-block;padding:4px 14px;border-radius:14px;background:var(--cream);color:var(--red);font:400 30px/1.1 "Lilita One",var(--font);letter-spacing:.02em}
  .sub{margin:2px 0 0;color:var(--muted);font-size:14px}
  .card{margin-top:18px;padding:16px;background:var(--white);border:1px solid var(--line);border-radius:18px}
  h2{margin:0 0 10px;font-size:18px}
  label{display:block;margin:10px 0 4px;font-size:14px;color:var(--muted)}
  input{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--white);font:500 16px var(--font);color:var(--ink)}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 14px;border:1.5px solid var(--ink);border-radius:12px;background:transparent;color:var(--ink);font:700 15px var(--font);cursor:pointer}
  .btn.main{background:var(--ink);color:var(--white)}
  .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .link{background:none;border:0;padding:0;color:var(--muted);font:500 14px var(--font);text-decoration:underline;cursor:pointer;margin-top:12px}
  .msg{margin-top:10px;font-size:14px}
  .msg.err{color:var(--red)} .msg.ok{color:#0a7a40}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  .stat{padding:10px 12px;border:1px solid var(--line);border-radius:12px}
  .stat b{display:block;font-size:22px}
  .stat span{color:var(--muted);font-size:13px}
  .chip{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--cream);font:700 12px var(--font);text-transform:uppercase;letter-spacing:.04em}
  .ver{margin-top:18px;text-align:center;color:var(--muted);font-size:12px}
  .pw{position:relative}
  .pw input{padding-right:48px}
  .eye{position:absolute;right:4px;top:4px;width:42px;height:36px;border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .eye img{width:30px;height:20px;display:block}

  /* Recetario */
  body.rec .head img{width:34px;height:34px} body.rec .brand{font-size:20px;padding:2px 10px;border-radius:10px} body.rec .sub{display:none}
  .pt{margin:12px 0 0;font-size:20px}
  .search{width:100%;height:42px;margin:8px 0;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--white);font:500 16px var(--font);color:var(--ink)}
  .fwrap{position:relative}
  .dd{display:flex;gap:6px;margin:2px 0 4px;overflow-x:auto;white-space:nowrap;scrollbar-width:none} .dd::-webkit-scrollbar{display:none}
  .pill{flex:none;display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;font:500 13px var(--font);background:transparent;color:var(--ink);cursor:pointer}
  .pill.on{border-color:var(--ink);background:var(--white);font-weight:700}
  .pill:after,.ord:after{content:'';width:5px;height:5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translate(-1px,-1px);margin-left:4px}
  .bar{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin:4px 2px 6px}
  .ord{display:inline-flex;align-items:center;background:none;border:0;padding:4px 0;font:500 12.5px var(--font);color:var(--muted);cursor:pointer} .ord b{color:var(--ink);font-weight:700;margin-left:3px}
  .pop{position:absolute;z-index:5;min-width:200px;max-width:calc(100vw - 32px);background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:4px 0}
  .opt{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;border:0;background:none;font:500 14px var(--font);color:var(--ink);text-align:left;cursor:pointer}
  .opt i{font-style:normal;margin-left:auto;color:var(--muted);font-size:12.5px;padding-left:12px}
  .cb{flex:none;width:18px;height:18px;border:1.5px solid #9a8f82;border-radius:5px;display:flex;align-items:center;justify-content:center}
  .cb.on{background:var(--ink);border-color:var(--ink)} .cb.on:after{content:'';width:5px;height:9px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg) translate(-1px,-1px)}
  .cb.rd{border-radius:50%} .cb.rd.on{background:none} .cb.rd.on:after{width:9px;height:9px;border:0;border-radius:50%;background:var(--ink);transform:none}
  .dot{flex:none;width:9px;height:9px;border-radius:50%}
  .popfoot{border-top:1px solid #ebe3d6;padding:6px 14px 4px;text-align:right} .popfoot button{background:none;border:0;font:500 13px var(--font);color:var(--muted);text-decoration:underline;cursor:pointer}
  .list{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .rrow{display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;padding:9px 12px;border:0;border-bottom:1px solid #ebe3d6;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
  .rrow:last-child{border-bottom:0}
  .rn{font-weight:700;font-size:15px;line-height:1.3} .rm{font-size:12.5px;color:var(--muted)}
  .rk{text-align:right;white-space:nowrap;font-size:11.5px;color:var(--muted)} .rk b{display:block;font-size:15px;color:var(--ink)}
  .rm{display:flex;align-items:center;flex-wrap:wrap;gap:2px 8px;margin-top:2px}
  .fq{display:inline-block;color:#fff;font-weight:700;font-size:10.5px;letter-spacing:.04em;padding:2px 8px;border-radius:99px;text-transform:uppercase}
  .fq.diaria{background:#00b65b} .fq.frecuente{background:#ff7a1a} .fq.ocasional{background:#e5192d} .fq.otra{background:var(--ink)}
  .ic{display:inline-flex;align-items:center;gap:3px;color:var(--muted);font-size:12.5px} .ic svg{display:block;flex:none}
  .empty{padding:14px;color:var(--muted);font-size:14px}
  .back{background:none;border:0;padding:6px 0;font:500 14px var(--font);color:var(--muted);cursor:pointer}
  .dchips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
  .dchips>span{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:var(--white)}
  .dchips>.fq{font-size:12px;padding:5px 12px;border:0}
  .box{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:10px}
  .box h3{margin:0 0 6px;font-size:15px}
  .kc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center} .kc b{display:block;font-size:20px;line-height:1.2} .kc span{font-size:12px;color:var(--muted)}
  .note{font-size:12px;color:var(--muted);margin-top:4px}
  .ing{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0;border-bottom:1px dashed #ebe3d6} .ing:last-child{border-bottom:0}
  .ing span{color:var(--muted);white-space:nowrap} .ing small{display:block;color:var(--muted);font-size:12px}
  .gusto{font-size:13px;color:var(--muted);margin-top:6px}
  .pasos{margin:0;padding-left:20px;font-size:14px} .pasos li{margin-bottom:5px}
  .ptext{font-size:14px;white-space:pre-line;margin:0}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="head">
    <img src="icon-192.png" alt="">
    <div><span class="brand">MI MENÚ</span><p class="sub">Semana, compra y recetas</p></div>
  </div>

  <section class="card" id="auth" hidden>
    <h2 id="authTitle">Entrar</h2>
    <form id="authForm" autocomplete="on">
      <div id="nameBox" hidden>
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" autocomplete="given-name" autocapitalize="words" maxlength="40">
      </div>
      <label for="email">Correo</label>
      <input id="email" type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      <label for="pass">Contraseña</label>
      <div class="pw">
        <input id="pass" type="password" autocomplete="current-password" minlength="8" required>
        <button class="eye" type="button" id="eye" aria-label="Mostrar contraseña"><img src="ojo-cerrado.png" alt=""></button>
      </div>
      <div class="row"><button class="btn main" type="submit" id="authGo">Entrar</button></div>
    </form>
    <button class="link" type="button" id="authSwitch">¿No tienes cuenta? Crear una</button>
    <p class="msg" id="authMsg" role="status"></p>
  </section>

  <section class="card" id="home" hidden>
    <h2>Hola<span id="who"></span></h2>
    <p class="sub" id="email2"></p>
    <div class="stats">
      <div class="stat"><b id="nAli">—</b><span>alimentos</span></div>
      <div class="stat"><b id="nRec">—</b><span>recetas</span></div>
    </div>
    <p class="msg" id="homeMsg"></p>
    <div class="row"><button class="btn main" type="button" id="goRec">Recetas</button><button class="btn" type="button" id="logout">Salir</button></div>
  </section>

  <section id="recetas" hidden>
    <button class="back" type="button" data-go="">‹ Inicio</button>
    <h2 class="pt">Recetas</h2>
    <input class="search" id="q" type="search" placeholder="Buscar receta o ingrediente" autocomplete="off" enterkeyhint="search">
    <div class="fwrap" id="fwrap"><div class="dd" id="dd"></div><div class="bar"><span id="cnt"></span><button class="ord" type="button" data-pop="orden">Ordenar:<b id="ordTxt">A-Z</b></button></div><div class="pop" id="pop" hidden></div></div>
    <div class="list" id="rlist"><div class="empty">Cargando recetas…</div></div>
  </section>

  <section id="receta" hidden>
    <button class="back" type="button" data-go="recetas">‹ Recetas</button>
    <div id="rdet"></div>
  </section>

  <p class="ver">Versión de prueba 0.10 · recetario con filtros</p>
</main>
<script>
  const SUPABASE_URL = 'https://cawmvpfjaehennkknmoy.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_vQDbCf2dlzKlFgpbMj7u2A_1wDlteT3'; // clave pública: la protección la ponen las reglas de cada tabla
  const $ = s => document.querySelector(s);
  let mode = 'login';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });

  function setMode(m) {
    mode = m;
    $('#authTitle').textContent = m === 'login' ? 'Entrar' : 'Crear cuenta';
    $('#authGo').textContent = m === 'login' ? 'Entrar' : 'Crear cuenta';
    $('#pass').autocomplete = m === 'login' ? 'current-password' : 'new-password';
    $('#authSwitch').textContent = m === 'login' ? '¿No tienes cuenta? Crear una' : 'Ya tengo cuenta: entrar';
    $('#authMsg').textContent = '';
    $('#nameBox').hidden = m === 'login';
    $('#nombre').required = m !== 'login';
  }
  const msg = (el, text, kind) => { el.textContent = text; el.className = 'msg ' + (kind || ''); };
  const es = e => {
    const t = String(e && e.message || e || '');
    if (/Invalid login/i.test(t)) return 'Correo o contraseña incorrectos.';
    if (/Email not confirmed/i.test(t)) return 'Falta confirmar el correo: abre el enlace que te ha llegado.';
    if (/already registered/i.test(t)) return 'Ese correo ya tiene cuenta: entra con él.';
    if (/Password should be/i.test(t)) return 'La contraseña debe tener al menos 8 caracteres.';
    if (/fetch|network/i.test(t)) return 'Sin conexión. Inténtalo cuando tengas internet.';
    return t;
  };

  async function show(session) {
    SESION = session;
    if (!session) { $('#home').hidden = true; $('#auth').hidden = false; ruta(); return; }
    $('#auth').hidden = true; $('#home').hidden = false; ruta();
    $('#email2').textContent = session.user.email;
    const { data: perfil } = await sb.from('perfiles').select('nombre, es_admin').eq('id', session.user.id).maybeSingle();
    $('#who').innerHTML = (perfil && perfil.nombre ? ', ' + perfil.nombre.replace(/[<>&]/g, '') : '') + (perfil && perfil.es_admin ? '<span class="chip">Administradora</span>' : '');
    const [a, r] = await Promise.all([
      sb.from('alimentos').select('id', { count: 'exact', head: true }),
      sb.from('recetas').select('id', { count: 'exact', head: true })
    ]);
    if (a.error || r.error) { msg($('#homeMsg'), es(a.error || r.error), 'err'); return; }
    $('#nAli').textContent = a.count; $('#nRec').textContent = r.count;
    msg($('#homeMsg'), 'Conectada a tu base de datos.', 'ok');
  }

  $('#eye').onclick = () => {
    const ver = $('#pass').type === 'password';
    $('#pass').type = ver ? 'text' : 'password';
    $('#eye img').src = ver ? 'ojo-abierto.png' : 'ojo-cerrado.png';
    $('#eye').setAttribute('aria-label', ver ? 'Ocultar contraseña' : 'Mostrar contraseña');
  };

  // ---------- Recetario ----------
  const ICO_NEVERA = '<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="19" rx="2.5"/><path d="M6 9h12M9.5 5v1.5M9.5 12v3.5"/></svg>';
  const ICO_CONGELA = '<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M9.5 4.5 12 7l2.5-2.5M9.5 19.5 12 17l2.5 2.5"/><path transform="rotate(60 12 12)" d="M12 2v20M9.5 4.5 12 7l2.5-2.5M9.5 19.5 12 17l2.5 2.5"/><path transform="rotate(120 12 12)" d="M12 2v20M9.5 4.5 12 7l2.5-2.5M9.5 19.5 12 17l2.5 2.5"/></svg>';
  const frec = f => { const k = String(f || '').trim().toUpperCase(); if (!k) return ''; const c = { DIARIA:'diaria', FRECUENTE:'frecuente', OCASIONAL:'ocasional' }[k] || 'otra'; return `<span class="fq ${c}" title="Frecuencia">${h(k)}</span>`; };
  const nevera = (d, largo) => d ? `<span class="ic" title="Días en la nevera" aria-label="Nevera: ${d} días">${ICO_NEVERA}${d} ${largo ? 'días' : 'd'}</span>` : '';
  const congela = (c, largo) => c ? `<span class="ic" title="Se puede congelar" aria-label="Se puede congelar">${ICO_CONGELA}${largo ? 'Se congela' : ''}</span>` : '';
  const h = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const norm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const FRAC = { 0.125:'⅛', 0.25:'¼', 0.333:'⅓', 0.5:'½', 0.667:'⅔', 0.75:'¾' };
  function num(n) {
    if (n == null) return '';
    const ent = Math.floor(n), dec = Math.round((n - ent) * 1000) / 1000;
    if (dec && FRAC[dec] && n < 10) return (ent ? ent : '') + FRAC[dec];
    return Number(n).toLocaleString('es-ES', { maximumFractionDigits: 2 });
  }
  const raciones = r => num(r) + (Number(r) === 1 ? ' ración' : ' raciones');
  let REC = null, ING_TXT = {}, desdeLista = '', popAbierto = '';
  const F = { cat: new Set(), frec: new Set(), cons: new Set(), orden: 'az' };
  const ORDENES = { az: 'A-Z', kcal_asc: 'menos kcal', kcal_desc: 'más kcal', prot_desc: 'más proteína' };
  const FRECS = [['DIARIA', 'Diaria', '#00b65b'], ['FRECUENTE', 'Frecuente', '#ff7a1a'], ['OCASIONAL', 'Ocasional', '#e5192d']];
  const CONS = [['congela', 'Se congela'], ['nevera', 'Dura en la nevera']];
  const pasa = (r, sin) => (sin === 'cat' || !F.cat.size || F.cat.has(r.categoria || 'Otras'))
    && (sin === 'frec' || !F.frec.size || F.frec.has(String(r.frecuencia || '').toUpperCase()))
    && (sin === 'cons' || !F.cons.size || [...F.cons].every(c => c === 'congela' ? r.congelable : r.dias_nevera > 0));

  async function cargarRecetas() {
    if (REC) return;
    const [r, i] = await Promise.all([
      sb.from('recetas').select('id, nombre, categoria, frecuencia, raciones_lote, kcal_pdf, proteina_pdf, grasa_pdf, hidratos_pdf, dias_nevera, congelable'),
      sb.from('ingredientes_receta').select('receta_id, nombre').limit(5000)
    ]);
    if (r.error) throw r.error;
    REC = (r.data || []).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    (i.data || []).forEach(x => { ING_TXT[x.receta_id] = (ING_TXT[x.receta_id] || '') + ' ' + norm(x.nombre); });
  }

  function pintarFiltros() {
    const n = (k, f) => REC.filter(r => pasa(r, k) && f(r)).length;
    const lbl = (t, set) => `<button class="pill${set.size ? ' on' : ''}" type="button" data-pop="${t[0]}">${t[1]}${set.size ? ' · ' + set.size : ''}</button>`;
    $('#dd').innerHTML = lbl(['cat', 'Categoría'], F.cat) + lbl(['frec', 'Frecuencia'], F.frec) + lbl(['cons', 'Conservación'], F.cons);
    $('#ordTxt').textContent = ORDENES[F.orden];
    const pop = $('#pop');
    if (!popAbierto) { pop.hidden = true; return; }
    let html = '';
    if (popAbierto === 'cat') {
      const cats = {}; REC.forEach(r => { const c = r.categoria || 'Otras'; cats[c] = 1; });
      html = Object.keys(cats).sort((a, b) => a.localeCompare(b, 'es')).map(c => `<button class="opt" type="button" data-set="cat" data-v="${h(c)}"><span class="cb${F.cat.has(c) ? ' on' : ''}"></span>${h(c)}<i>${n('cat', r => (r.categoria || 'Otras') === c)}</i></button>`).join('');
    } else if (popAbierto === 'frec') {
      html = FRECS.map(([v, t, col]) => `<button class="opt" type="button" data-set="frec" data-v="${v}"><span class="cb${F.frec.has(v) ? ' on' : ''}"></span>${t}<span class="dot" style="background:${col}"></span><i>${n('frec', r => String(r.frecuencia || '').toUpperCase() === v)}</i></button>`).join('');
    } else if (popAbierto === 'cons') {
      html = CONS.map(([v, t]) => `<button class="opt" type="button" data-set="cons" data-v="${v}"><span class="cb${F.cons.has(v) ? ' on' : ''}"></span>${t}<i>${n('cons', r => v === 'congela' ? r.congelable : r.dias_nevera > 0)}</i></button>`).join('');
    } else if (popAbierto === 'orden') {
      html = Object.entries(ORDENES).map(([v, t]) => `<button class="opt" type="button" data-orden="${v}"><span class="cb rd${F.orden === v ? ' on' : ''}"></span>${t.charAt(0).toUpperCase() + t.slice(1)}${v === 'az' ? '' : ' primero'}</button>`).join('');
    }
    if (popAbierto !== 'orden' && F[popAbierto].size) html += '<div class="popfoot"><button type="button" data-limpiar="' + popAbierto + '">Quitar</button></div>';
    pop.innerHTML = html; pop.hidden = false;
    const btn = $('#fwrap').querySelector(`[data-pop="${popAbierto}"]`), wr = $('#fwrap').getBoundingClientRect(), br = btn.getBoundingClientRect();
    pop.style.top = (br.bottom - wr.top + 6) + 'px';
    if (popAbierto === 'orden') { pop.style.left = ''; pop.style.right = '0px'; } else { pop.style.right = ''; pop.style.left = Math.max(0, Math.min(br.left - wr.left, wr.width - pop.offsetWidth)) + 'px'; }
  }

  function pintarLista() {
    pintarFiltros();
    const q = norm($('#q').value.trim());
    const kc = (r, d) => r.kcal_pdf == null ? (d ? -1 : 1e9) : r.kcal_pdf;
    const vis = REC.filter(r => pasa(r) && (!q || norm(r.nombre).includes(q) || (ING_TXT[r.id] || '').includes(q)));
    if (F.orden === 'kcal_asc') vis.sort((a, b) => kc(a, 0) - kc(b, 0));
    else if (F.orden === 'kcal_desc') vis.sort((a, b) => kc(b, 1) - kc(a, 1));
    else if (F.orden === 'prot_desc') vis.sort((a, b) => (b.proteina_pdf ?? -1) - (a.proteina_pdf ?? -1));
    $('#cnt').textContent = `${vis.length} de ${REC.length} recetas`;
    $('#rlist').innerHTML = vis.length ? vis.map(r => `<button class="rrow" data-id="${h(r.id)}"><div>
        <div class="rn">${h(r.nombre)}</div>
        <div class="rm">${frec(r.frecuencia)}<span>${raciones(r.raciones_lote)}</span>${nevera(r.dias_nevera)}${congela(r.congelable)}</div>
      </div><div class="rk"><b>${r.kcal_pdf == null ? '—' : num(Math.round(r.kcal_pdf))}</b>kcal/ración</div></button>`).join('')
      : '<div class="empty">No hay recetas con esa búsqueda.</div>';
  }

  function pasosHtml(t) {
    t = String(t || '').trim(); if (!t) return '';
    const plano = t.replace(/\s*\n\s*/g, ' ').replace(/\s{2,}/g, ' ');
    const partes = plano.split(/(?:^|\s)\d{1,2}\s*[.)]\s*/).map(x => x.trim()).filter(Boolean);
    if (partes.length > 1 && /^\s*1\s*[.)]/.test(plano)) return '<ol class="pasos">' + partes.map(x => `<li>${h(x)}</li>`).join('') + '</ol>';
    return `<p class="ptext">${h(t)}</p>`;
  }

  async function pintarReceta(id) {
    const r = REC.find(x => x.id === id);
    if (!r) { $('#rdet').innerHTML = '<p class="msg err">No encuentro esa receta.</p>'; return; }
    $('#rdet').innerHTML = `<h2 class="pt">${h(r.nombre)}</h2><p class="note">Cargando…</p>`;
    const [d, ing] = await Promise.all([
      sb.from('recetas').select('pasos, conservacion').eq('id', id).maybeSingle(),
      sb.from('ingredientes_receta').select('orden, nombre, cantidad, unidad, al_gusto, nota').eq('receta_id', id).order('orden')
    ]);
    if (d.error || ing.error) { $('#rdet').innerHTML = `<p class="msg err">${h(es(d.error || ing.error))}</p>`; return; }
    const lista = ing.data || [];
    const conCant = lista.filter(i => i.cantidad != null && !i.al_gusto);
    const gusto = lista.filter(i => !(i.cantidad != null && !i.al_gusto)).map(i => i.nombre.replace(/\s+al gusto\b/i, '').trim()).map(t => /^.[A-ZÁÉÍÓÚÑ]/.test(t) ? t : t.charAt(0).toLowerCase() + t.slice(1));
    const chips = [r.categoria ? `<span>${h(r.categoria)}</span>` : '', `<span>${raciones(r.raciones_lote)}</span>`,
      r.dias_nevera ? `<span>${nevera(r.dias_nevera, true)}</span>` : '', r.congelable ? `<span>${congela(true, true)}</span>` : ''].filter(Boolean);
    const cons = (d.data && d.data.conservacion || '').trim();
    $('#rdet').innerHTML = `<h2 class="pt">${h(r.nombre)}</h2>
      <div class="dchips">${frec(r.frecuencia)}${chips.join('')}</div>
      <div class="box"><div class="kc"><div><b>${r.kcal_pdf == null ? '—' : num(Math.round(r.kcal_pdf))}</b><span>kcal</span></div>
        <div><b>${r.proteina_pdf == null ? '—' : num(r.proteina_pdf)}</b><span>g proteína</span></div>
        <div><b>${r.hidratos_pdf == null ? '—' : num(r.hidratos_pdf)}</b><span>g hidratos</span></div>
        <div><b>${r.grasa_pdf == null ? '—' : num(r.grasa_pdf)}</b><span>g grasa</span></div></div>
        <div class="note">Por ración · dato orientativo del PDF. Cuando cada ingrediente esté unido a su ficha, se calculará con los datos reales.</div></div>
      <div class="box"><h3>Ingredientes</h3>${conCant.map(i => `<div class="ing"><div>${h(i.nombre)}${i.nota ? `<small>${h(i.nota)}</small>` : ''}</div><span>${num(i.cantidad)} ${h(i.unidad || '')}</span></div>`).join('') || '<p class="note">Sin ingredientes apuntados.</p>'}
        ${gusto.length ? `<div class="gusto">Al gusto: ${h(gusto.join(', '))}</div>` : ''}</div>
      ${d.data && d.data.pasos ? `<div class="box"><h3>Pasos</h3>${pasosHtml(d.data.pasos)}</div>` : ''}
      ${cons ? `<div class="box"><h3>Conservación</h3><p class="ptext">${h(cons)}</p></div>` : ''}`;
    window.scrollTo(0, 0);
  }

  let SESION = null;
  async function ruta() {
    const hsh = location.hash.replace(/^#/, '');
    const enRec = hsh === 'recetas' || hsh.startsWith('receta/');
    document.body.classList.toggle('rec', !!SESION && enRec);
    $('#recetas').hidden = !(SESION && hsh === 'recetas');
    $('#receta').hidden = !(SESION && hsh.startsWith('receta/'));
    if (SESION) $('#home').hidden = enRec;
    if (!SESION || !enRec) return;
    try { await cargarRecetas(); } catch (e) { $('#rlist').innerHTML = `<div class="empty">${h(es(e))}</div>`; return; }
    if (hsh === 'recetas') pintarLista(); else pintarReceta(decodeURIComponent(hsh.slice(7)));
  }
  window.addEventListener('hashchange', ruta);
  $('#fwrap').onclick = e => {
    e.stopPropagation();
    const p = e.target.closest('[data-pop]'), o = e.target.closest('[data-set]'), od = e.target.closest('[data-orden]'), l = e.target.closest('[data-limpiar]');
    if (p) { popAbierto = popAbierto === p.dataset.pop ? '' : p.dataset.pop; pintarFiltros(); return; }
    if (o) { const set = F[o.dataset.set], v = o.dataset.v; set.has(v) ? set.delete(v) : set.add(v); pintarLista(); return; }
    if (od) { F.orden = od.dataset.orden; popAbierto = ''; pintarLista(); return; }
    if (l) { F[l.dataset.limpiar].clear(); popAbierto = ''; pintarLista(); }
  };
  document.addEventListener('click', e => { if (popAbierto && !e.target.closest('#fwrap')) { popAbierto = ''; pintarFiltros(); } });
  $('#q').oninput = () => pintarLista();
  $('#rlist').onclick = e => { const b = e.target.closest('[data-id]'); if (b) { desdeLista = 'receta/' + encodeURIComponent(b.dataset.id); location.hash = 'receta/' + encodeURIComponent(b.dataset.id); } };
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
    const destino = b.dataset.go;
    if (destino === 'recetas' && desdeLista && location.hash === '#' + desdeLista) { desdeLista = ''; history.back(); } else location.hash = destino;
  });
  $('#goRec').onclick = () => { location.hash = 'recetas'; };

  $('#authSwitch').onclick = () => setMode(mode === 'login' ? 'signup' : 'login');
  $('#authForm').onsubmit = async ev => {
    ev.preventDefault();
    const email = $('#email').value.trim(), password = $('#pass').value, nombre = $('#nombre').value.trim();
    $('#authGo').disabled = true; msg($('#authMsg'), mode === 'login' ? 'Entrando…' : 'Creando la cuenta…');
    try {
      if (mode === 'login') {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname, data: { nombre } } });
        if (error) throw error;
        if (!data.session) { msg($('#authMsg'), 'Cuenta creada. Te ha llegado un correo: abre el enlace para confirmarla y después entra aquí.', 'ok'); setMode('login'); $('#email').value = email; return; }
      }
    } catch (e) { msg($('#authMsg'), es(e), 'err'); }
    finally { $('#authGo').disabled = false; }
  };
  $('#logout').onclick = async () => { await sb.auth.signOut(); REC = null; ING_TXT = {}; if (location.hash) location.hash = ''; };

  sb.auth.onAuthStateChange((_ev, session) => { show(session); });
  sb.auth.getSession().then(({ data }) => show(data.session));
  setMode('login');

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
